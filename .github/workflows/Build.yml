name: Build Redis CLI for Termux (with TLS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Enable TLS in redis build.sh
        working-directory: termux-packages/packages/redis
        run: |
          if ! grep -q "BUILD_TLS" build.sh; then
            sed -i 's/make -C src -j "\$TERMUX_PKG_MAKE_PROCESSES"/make -C src -j "\$TERMUX_PKG_MAKE_PROCESSES" BUILD_TLS=yes/' build.sh
          fi
          if ! grep -q 'openssl' build.sh; then
            sed -i 's/TERMUX_PKG_DEPENDS="\([^"]*\)"/TERMUX_PKG_DEPENDS="\1, openssl"/' build.sh
          fi
          echo "=== build.sh after modification ==="
          cat build.sh

      - name: Build redis via Docker
        working-directory: termux-packages
        run: |
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I redis

      # ⬇️ BƯỚC MỚI: đổi tên để loại bỏ dấu ':'
      - name: Sanitize .deb filenames
        run: |
          cd termux-packages/output
          for f in *.deb; do
            newname=$(echo "$f" | tr ':' '_')
            [ "$f" != "$newname" ] && mv "$f" "$newname"
          done
          echo "=== Files in output ==="
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-termux-aarch64
          path: termux-packages/output/*.deb
