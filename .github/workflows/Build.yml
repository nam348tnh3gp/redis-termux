name: Build Redis CLI for Termux (with TLS)

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone termux-packages
        run: |
          git clone https://github.com/termux/termux-packages.git
          cd termux-packages

      - name: Enable TLS in redis build.sh
        run: |
          cd termux-packages/packages/redis
          # Thêm BUILD_TLS=yes vào lệnh make
          sed -i 's/make -C src -j "\$TERMUX_PKG_MAKE_PROCESSES"/make -C src -j "\$TERMUX_PKG_MAKE_PROCESSES" BUILD_TLS=yes/' build.sh
          # Thêm openssl vào danh sách phụ thuộc (nếu chưa có)
          if ! grep -q 'openssl' build.sh; then
            sed -i 's/TERMUX_PKG_DEPENDS="\(.*\)"/TERMUX_PKG_DEPENDS="\1, openssl"/' build.sh
          fi
          cat build.sh # In ra để kiểm tra

      - name: Build redis package
        run: |
          cd termux-packages
          ./scripts/setup-termux.sh
          ./build-package.sh -I redis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-termux-aarch64
          path: termux-packages/output/*.deb
